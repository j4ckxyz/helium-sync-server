# Helium Sync behind Caddy (automatic HTTPS).
#   1. Point a DNS name (e.g. sync.example.com) at this machine.
#   2. Replace sync.example.com below (twice), then: docker compose up -d
#   3. docker compose logs helium-sync   → shows the first invite code
services:
  helium-sync:
    build: ..
    restart: unless-stopped
    environment:
      HELIUM_SYNC_PUBLIC_URL: https://sync.example.com
      HELIUM_SYNC_TRUST_PROXY: "true"
    volumes:
      - helium-sync-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from sync.example.com --to helium-sync:8080
    volumes:
      - caddy-data:/data

volumes:
  helium-sync-data:
  caddy-data:
