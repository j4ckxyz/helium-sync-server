<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synced history</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="ui.css">
  <style>
    /* A ledger: date groups under heavy rules, one ruled row per visit. */
    main { max-width: 1168px; margin: 0 auto; padding: 0 24px 96px; }
    .top { display: flex; align-items: center; gap: 12px; padding: 24px 0 16px; border-bottom: 2px solid var(--ink); }
    .top h1 { font-size: 2.5rem; letter-spacing: -0.03em; line-height: 1.05; }
    .find { padding: 24px 0 8px; max-width: 760px; }
    .find p { margin-top: 8px; max-width: 70ch; }
    .day { position: sticky; top: 0; background: var(--paper); font-size: 1rem; letter-spacing: 0; margin-top: 24px; padding: 8px 0; border-bottom: 2px solid var(--ink); z-index: 1; }
    .entry { display: grid; grid-template-columns: 5.5rem 16px minmax(0, 1fr) minmax(0, 14rem) 7rem; column-gap: 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule); text-decoration: none; }
    .entry:hover .grow { text-decoration: underline; text-underline-offset: 0.2em; }
    .entry:focus-visible { outline-offset: -2px; }
    .entry time { font: 0.8125rem/1.5 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
    .entry .host { color: var(--muted); font-size: 0.875rem; }
    .src { justify-self: end; font-size: 0.75rem; border: 1px solid var(--rule); border-radius: var(--radius); padding: 0 6px; white-space: nowrap; }
    #results > p { padding: 24px 0; border-bottom: 1px solid var(--rule); }
    @media (max-width: 640px) {
      main { padding: 0 16px 64px; }
      .top h1 { font-size: 2rem; }
      .entry { grid-template-columns: 4.5rem 16px minmax(0, 1fr) auto; column-gap: 10px; }
      .entry .grow { grid-column: 3 / 5; }
      .entry .host { grid-column: 3; grid-row: 2; }
      .src { grid-column: 4; grid-row: 2; }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <svg class="mark" width="32" height="32" viewBox="20 20 88 88" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="square" aria-hidden="true"><path d="M36 54a30 30 0 0 1 51-15l7 7"/><path d="M94 30v16H78"/><path d="M92 74a30 30 0 0 1-51 15l-7-7"/><path d="M34 98V82h16"/></svg>
      <h1 class="grow">Synced history</h1>
    </header>
    <div class="find">
      <input type="search" id="q" placeholder="Search history from all your devices" aria-label="Search history from all your devices" autofocus>
      <p class="muted small">Visits from other devices are added to Helium's own history while they are recent; older ones are kept here.</p>
    </div>
    <div id="results"></div>
  </main>
  <script type="module" src="history.js"></script>
</body>
</html>
