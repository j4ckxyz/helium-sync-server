<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synced history</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="ui.css">
  <style>
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .day { margin: 22px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .entry { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; color: var(--text); }
    .entry:hover { background: var(--surface-2); text-decoration: none; }
    .entry time { width: 52px; flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .entry .host { color: var(--muted); font-size: 12px; flex: none; max-width: 200px; }
    .src { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; flex: none; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <img src="../icons/icon-32.png" width="28" height="28" alt="" style="border-radius:7px">
      <h1 class="grow">Synced history</h1>
    </div>
    <input type="search" id="q" placeholder="Search history from all your devices" autofocus>
    <p class="muted small" style="margin-top:8px">Visits from other devices are added to Helium's own history while they are recent; older ones are kept here.</p>
    <div id="results"></div>
  </main>
  <script type="module" src="history.js"></script>
</body>
</html>
