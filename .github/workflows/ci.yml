name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Go
        run: |
          test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
          go vet ./...
          go test -race ./...
      - name: Extension unit tests
        run: node --test test/unit/*.test.js
      - name: Scripts
        run: |
          sh -n scripts/tweak.sh
          sh -n scripts/install-server.sh
      - name: Cross-compile
        run: make dist
